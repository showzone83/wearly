# Wearly 로컬 개발 환경: DB · Valkey · MinIO(옷 사진) · 백엔드 · 관리자 사이트 (앱은 Mac에서 cd mobile && npx expo start로 따로 띄운다)
# 관리자 SSO 시험용 Keycloak은 profile sso로만 뜬다 (아래 keycloak 서비스).
#
#   docker compose up -d --build          전체 빌드·실행
#   docker compose up -d db valkey minio minio-init   DB·Valkey·사진 저장소만 (백엔드를 Mac에서 ./gradlew bootRun으로 돌릴 때)
#   docker compose up -d --build backend  백엔드만 다시 빌드·재시작
#   docker compose logs -f backend        로그 보기
#   docker compose --profile sso up -d keycloak   관리자 SSO 시험용 Keycloak (8180)
#   docker compose down                   중지 (DB 데이터는 wearly-pgdata, 세션은 wearly-valkeydata, 사진은 wearly-miniodata 볼륨에 남는다)
#
# 호스트 포트: DB 5433(다른 프로젝트의 postgres와 겹치지 않게), Valkey 6380(다른 Redis와 겹치지 않게),
#   MinIO 9000(S3 API, 앱이 서명 URL로 직접 올리고 받는다)·9001(웹 콘솔), 백엔드 8080, 관리자 사이트 5173(백엔드 CORS 허용 출처).
# 백엔드 비밀 값은 backend/config/application-local.yml(git 제외)을 읽기 전용으로 마운트해서 넘긴다. 이미지에는 넣지 않는다.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: wearly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wearly
      POSTGRES_USER: wearly
      POSTGRES_PASSWORD: wearly
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - wearly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wearly -d wearly"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 로그인 세션·Refresh 토큰 저장소 (Redis 호환, doc/16_세션_Valkey.md). AOF로 재시작해도 세션이 남는다
  valkey:
    image: valkey/valkey:9.1
    container_name: wearly-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - wearly-valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 옷 사진 저장소 (S3 호환). 버킷 wearly-images는 비공개라 앱은 백엔드가 준 서명 URL로만 올리고 받는다.
  # MinIO 본가는 2025년 하반기부터 커뮤니티판 Docker 이미지를 내지 않아(minio/minio·quay.io/minio/minio 모두 받을 수 없음)
  # 같은 MinIO 코드를 이어 빌드하는 커뮤니티 포크 pgsty/minio를 쓴다. 명령·환경변수·콘솔은 MinIO와 같다.
  # 계정 wearly / wearly-minio-local은 로컬 전용 값이다 (DB 비밀번호 wearly와 같은 취급)
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: wearly-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: wearly
      MINIO_ROOT_PASSWORD: wearly-minio-local
      # Expo 웹(브라우저)이 서명 URL로 바로 PUT·GET할 수 있게 모든 출처를 허용한다 (로컬 전용. 네이티브 앱은 CORS와 상관없음)
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wearly-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 버킷을 만드는 1회성 작업 (이미 있으면 그대로 통과). 끝나면 컨테이너가 멈춘다(Exited 0)
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: wearly-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 wearly wearly-minio-local
        mc mb --ignore-existing local/wearly-images
        mc anonymous set none local/wearly-images
        echo "버킷 wearly-images 준비됨 (비공개)"

  backend:
    build:
      context: ./backend
    image: wearly-backend:local
    container_name: wearly-backend
    restart: unless-stopped
    # application-docker.yml: DB 주소를 db:5432, Valkey를 valkey:6379, 사진 저장소를 minio:9000으로 (비밀 값 없음)
    command: ["--spring.profiles.active=docker"]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      # 파일 하나만 마운트하면 파일이 없을 때 디렉터리가 생겨 기동이 깨지므로 폴더째 마운트한다.
      # 서버는 /app/config/application-local.yml을 읽는다 (없으면 건너뜀)
      - ./backend/config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # 관리자 사이트 SSO 시험용 IdP (doc/22 4.2, 범용 OIDC). 무거워서 기본 실행에는 넣지 않는다 (profile sso):
  #   docker compose --profile sso up -d keycloak     http://localhost:8180 (관리 콘솔 admin / wearly-keycloak-local)
  # dev 모드라 별도 DB 없이 컨테이너 안(H2)에 둔다. 시작할 때 infra/keycloak/wearly-realm.json을 들여온다(이미 있으면 건너뜀).
  # 처음 상태로 되돌리기: docker compose --profile sso rm -sf keycloak 후 다시 up.
  # KC_HOSTNAME을 브라우저가 보는 주소로 고정해 토큰 iss가 늘 http://localhost:8180/realms/wearly다.
  # 컨테이너 안의 backend는 서버끼리 부를 때만 keycloak:8080을 쓴다 (application-docker.yml backchannel-rewrites).
  # backend는 keycloak을 기다리지 않는다 (SSO는 선택 기능). 계정·비밀번호는 모두 로컬 전용 시험 값이다
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: wearly-keycloak
    profiles: ["sso"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: wearly-keycloak-local
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      TZ: Asia/Seoul
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # 이미지에 curl이 없어 bash /dev/tcp로 관리 포트(9000, 호스트에 열지 않음)의 /health/ready를 본다
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  admin:
    build:
      # 관리자 사이트가 ../mobile/src/data의 순수 TS(옷 모양·테마·마스코트)를 가져오므로 컨텍스트는 저장소 루트 (.dockerignore로 필요한 것만)
      context: .
      dockerfile: admin/Dockerfile
      args:
        # 브라우저(Mac)에서 부르는 백엔드 주소
        VITE_API_URL: http://localhost:8080
    image: wearly-admin:local
    container_name: wearly-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  wearly-pgdata:
  wearly-valkeydata:
  wearly-miniodata:
