# 관리자 사이트 정적 파일 서빙 (admin/Dockerfile). react-router BrowserRouter라 없는 경로는 index.html로 돌린다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 파일 이름에 해시가 붙는 빌드 결과는 오래 캐시한다
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    # index.html은 새 배포가 바로 보이게 캐시하지 않는다
    add_header Cache-Control "no-cache";
  }
}
