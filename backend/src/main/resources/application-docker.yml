# docker compose 프로필 (루트 docker-compose.yml의 backend 서비스가 --spring.profiles.active=docker로 켠다).
# 비밀 값은 두지 않는다. AI 키·관리자 계정·마스터 키는 마운트한 /app/config/application-local.yml에서 읽는다.
spring:
  datasource:
    # compose 네트워크 안의 db 서비스 (호스트 5433이 아니라 컨테이너 포트 5432)
    url: jdbc:postgresql://db:5432/wearly
  data:
    redis:
      # compose 네트워크 안의 valkey 서비스 (호스트 6380이 아니라 컨테이너 포트 6379)
      host: valkey
      port: 6379
