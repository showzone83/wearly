# docker compose 프로필 (루트 docker-compose.yml의 backend 서비스가 --spring.profiles.active=docker로 켠다).
# 비밀 값은 두지 않는다 (MinIO 계정 wearly / wearly-minio-local은 application.yml 기본값과 같은 로컬 전용 값). AI 키·관리자 계정·마스터 키는 마운트한 /app/config/application-local.yml에서 읽는다.
spring:
  datasource:
    # compose 네트워크 안의 db 서비스 (호스트 5433이 아니라 컨테이너 포트 5432)
    url: jdbc:postgresql://db:5432/wearly
  data:
    redis:
      # compose 네트워크 안의 valkey 서비스 (호스트 6380이 아니라 컨테이너 포트 6379)
      host: valkey
      port: 6379

wearly:
  storage:
    # 백엔드 → MinIO는 compose 네트워크 안의 minio:9000. 앱이 받는 서명 URL은 public-endpoint가 비어 있으므로
    # 요청 Host 이름 + 9000 (시뮬레이터 http://localhost:9000, 실제 휴대폰 http://<Mac LAN IP>:9000)
    endpoint: http://minio:9000
