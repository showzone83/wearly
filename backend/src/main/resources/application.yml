# 모든 값은 환경변수로 덮어쓸 수 있다. backend/.env(git 제외)도 읽는다.
# .env에 적은 값은 일반 속성으로 들어오므로 아래처럼 ${환경변수명:기본값} 자리표시자로 받는다.
spring:
  application:
    name: wearly-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/wearly}
    username: ${SPRING_DATASOURCE_USERNAME:wearly}
    password: ${SPRING_DATASOURCE_PASSWORD:wearly}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 분석 이미지 10MB 제한. 초과하면 413 IMAGE_TOO_LARGE
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 한도를 넘긴 업로드에도 JSON 오류 응답을 끝까지 보내기 위해 본문을 받아 버린다
    max-swallow-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: app.wearly.common.mybatis
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

wearly:
  jwt:
    issuer: wearly
    # 개발용 기본값. prod 프로필에서는 WEARLY_JWT_SECRET이 반드시 있어야 한다 (application-prod.yml)
    secret: ${WEARLY_JWT_SECRET:dev-only-wearly-jwt-secret-change-me-0123456789}
    access-ttl: ${WEARLY_ACCESS_TTL:PT30M}
    refresh-ttl: ${WEARLY_REFRESH_TTL:P30D}
  ai:
    provider: ${WEARLY_AI_PROVIDER:auto}
    model: ${WEARLY_AI_MODEL:claude-opus-5-5}
    daily-limit: ${WEARLY_AI_DAILY_LIMIT:10}
    api-key: ${ANTHROPIC_API_KEY:}
    effort: ${WEARLY_AI_EFFORT:medium}
    timeout: ${WEARLY_AI_TIMEOUT:PT60S}
  cors:
    allowed-origins:
      - http://localhost:8081
      - http://localhost:19006
      - http://127.0.0.1:8081
