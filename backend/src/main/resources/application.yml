# 공통 설정 (git 포함, 비밀 값 없음). doc/08_백엔드_구조.md 6장.
# 로컬 비밀 값(AI 키, 관리자 계정, 마스터 키 …)은 backend/config/application-local.yml(git 제외)에 같은 속성 이름으로 적는다.
#   견본: backend/config/application-local.example.yml. 다른 파일을 쓰려면 WEARLY_LOCAL_CONFIG=<경로>
#   (테스트·하네스는 이 값을 없는 경로로 줘서 개발용 파일을 읽지 않는다)
# 아래 ${이름:기본값} 자리표시자는 OS 환경변수로도 덮어쓸 수 있다 (운영 서버·docker 등).
spring:
  application:
    name: wearly-backend
  config:
    # 들여온 파일의 값이 이 파일 값보다 우선한다. 파일이 없으면 건너뛴다(optional)
    import: optional:file:${WEARLY_LOCAL_CONFIG:./config/application-local.yml}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/wearly}
    username: ${SPRING_DATASOURCE_USERNAME:wearly}
    password: ${SPRING_DATASOURCE_PASSWORD:wearly}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      # 로그인 세션·Refresh 토큰 저장소 Valkey (16 문서). 로컬은 compose의 wearly-valkey(호스트 6380), 비밀번호 없음.
      # docker 프로필은 valkey:6379 (application-docker.yml), 운영은 같은 속성(환경변수 SPRING_DATA_REDIS_*)으로 덮어쓴다
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      # 하네스는 운영 데이터와 섞이지 않게 다른 DB 번호(1)를 쓴다
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 분석 이미지 10MB 제한. 초과하면 413 IMAGE_TOO_LARGE
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  # 오류 응답에 서버 내부 정보(예외 메시지·스택·검증 원문·예외 클래스)를 넣지 않는다.
  # /error도 우리 형식 { status, code, fieldErrors, traceId }으로 쓴다 (common.error.ErrorPageController)
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  tomcat:
    # 한도를 넘긴 업로드에도 JSON 오류 응답을 끝까지 보내기 위해 본문을 받아 버린다
    max-swallow-size: 20MB

logging:
  pattern:
    # 모든 로그 줄에 요청 추적 ID(traceId, 응답 헤더 X-Request-Id·오류 본문 traceId와 같다)와 회원 ID를 찍는다.
    # 값은 common.web.TraceIdFilter와 auth.adapter.in.web.UserIdMdcFilter가 MDC에 넣는다 (요청 밖이면 비어 있다)
    level: "%5p [traceId=%X{traceId:-} userId=%X{userId:-}]"

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: app.wearly.common.mybatis
  configuration:
    map-underscore-to-camel-case: true
    # 결과를 record(생성자만 있는 클래스)로 바로 받을 때 컬럼 이름과 생성자 인자 이름으로 맞춘다 (08 문서 7장 port.out.dto)
    arg-name-based-constructor-auto-mapping: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

wearly:
  jwt:
    issuer: wearly
    # 개발용 기본값. prod 프로필에서는 WEARLY_JWT_SECRET이 반드시 있어야 한다 (application-prod.yml)
    secret: ${WEARLY_JWT_SECRET:dev-only-wearly-jwt-secret-change-me-0123456789}
    access-ttl: ${WEARLY_ACCESS_TTL:PT30M}
    refresh-ttl: ${WEARLY_REFRESH_TTL:P30D}
  ai:
    # db(기본): 관리자 화면의 AI 공급자 설정(tb_ai_provider)을 우선순위 순으로 쓴다. mock: 목업 (./gradlew bootRunMock)
    # 공급자 키는 tb_ai_provider.api_key_env의 키 이름(ANTHROPIC_API_KEY …)으로 찾는다:
    #   웹 입력 키(DB) → wearly.ai.keys.<키 이름>(application-local.yml) → 같은 이름의 OS 환경변수
    provider: ${WEARLY_AI_PROVIDER:db}
    daily-limit: ${WEARLY_AI_DAILY_LIMIT:10}
    # AI 코디 추천 일일 한도 (회원별, 사진 분석과 따로 센다. 성공만)
    outfit-daily-limit: ${WEARLY_AI_OUTFIT_DAILY_LIMIT:20}
    timeout: ${WEARLY_AI_TIMEOUT:PT60S}
    allow-base-url: ${WEARLY_AI_ALLOW_BASE_URL:false}
    # 사진 분석: 공급자에 보내기 전에 긴 변을 이 픽셀 이하 JPEG로 줄인다 (multipart 업로드·{imageId} 모두).
    # 이미 작으면(긴 변이 이 값 이하) 다시 인코딩하지 않고 그대로 보낸다. JPEG·PNG만 줄이고 webp·heic는 그대로 보낸다
    image-max-side: ${WEARLY_AI_IMAGE_MAX_SIDE:1024}
    image-quality: ${WEARLY_AI_IMAGE_QUALITY:0.8}
    # 프롬프트 캐싱: true(기본)면 Claude 요청의 고정 지시문(system: 지시·허용 값 목록·점수 기준) 끝에
    # cache_control(ephemeral, 5분)을 붙인다. 같은 지시문을 5분 안에 다시 보내면 캐시 읽기(입력 단가의 0.1배 안팎)로 계산된다.
    # OpenAI·Gemini는 같은 앞부분을 공급자가 자동으로 캐시하므로 이 값과 상관없다
    prompt-cache:
      enabled: ${WEARLY_AI_PROMPT_CACHE_ENABLED:true}
    # 공급자 종류별 내장 모델 목록 (관리자 화면 모델 드롭다운, doc/07 4장).
    # 키가 없거나 제공사 모델 목록을 받지 못했을 때 이 목록을 보여 주고(source: CATALOG),
    # 제공사 목록(source: LIVE)에서도 여기 있는 ID에는 recommended를 그대로 붙인다.
    # 종류 이름은 tb_ai_provider.type(CLAUDE·OPENAI·GEMINI). 없는 종류는 빈 목록이라 화면에서 직접 입력한다.
    # OPENAI·GEMINI는 확실한 최신 ID를 정하지 않아 비워 둔다 (키를 넣으면 제공사 목록이 나온다)
    model-catalog:
      CLAUDE:
        - id: claude-opus-5-5
          display-name: Claude Opus 5.5
        - id: claude-sonnet-5-5
          display-name: Claude Sonnet 5.5
          recommended: true
        - id: claude-haiku-5-5
          display-name: Claude Haiku 5.5
  # 날씨 정보 (doc/17_날씨.md). 서버가 주기적으로 받아 DB에 두고 앱에는 저장한 값만 준다.
  # 주기·예보 일수·공급자 사용 여부·월 한도는 DB(tb_weather_setting·tb_weather_provider)와 관리자 화면에서 바꾼다
  weather:
    # db(기본): 관리자 공급자 설정대로 부른다. mock: 공급자 대신 목업 날씨 (키 없이 화면 확인용)
    provider: ${WEARLY_WEATHER_PROVIDER:db}
    timeout: ${WEARLY_WEATHER_TIMEOUT:PT10S}
    log-retention-days: ${WEARLY_WEATHER_LOG_RETENTION_DAYS:90}
    # false면 주기 실행·시작 실행·이력 정리를 끈다 (테스트용). 관리자 "지금 실행"은 그대로 된다
    scheduler-enabled: ${WEARLY_WEATHER_SCHEDULER_ENABLED:true}
    base-urls:
      WEATHERAPI: https://api.weatherapi.com/v1
    # 공급자 행의 키 이름(key_name) → 키 값. 실제 값은 config/application-local.yml에 적는다 (없으면 같은 이름의 OS 환경변수)
    keys:
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:}
    # 장소별 날씨 (doc/19). REGION 밖 좌표는 요청 때 공급자를 부르고 격자(소수 첫째 자리)별로 캐시한다
    place-cache-ttl: ${WEARLY_WEATHER_PLACE_CACHE_TTL:PT3H}
    # 회원마다 하루(한국 날짜)에 공급자를 실제로 부르게 할 수 있는 좌표 요청 수. 넘으면 예전 캐시·평년값, 둘 다 없으면 429 WEATHER_LIMIT
    on-demand-daily-limit: ${WEARLY_WEATHER_ON_DEMAND_DAILY_LIMIT:30}
    # 장소 검색 결과 캐시 (같은 검색어, 소문자·공백 정리)
    search-cache-ttl: ${WEARLY_WEATHER_SEARCH_CACHE_TTL:P1D}
    # 회원마다 하루에 공급자를 실제로 부르게 할 수 있는 장소 검색 수 (캐시에서 준 검색은 세지 않는다)
    search-daily-limit: ${WEARLY_WEATHER_SEARCH_DAILY_LIMIT:100}
    # 예보 밖 날짜의 평년값: Open-Meteo 과거 기상 API (키 없음). 무료 API는 비상업용이다.
    # 상업 서비스로 바꿀 때는 유료 플랜 주소(customer-archive-api.open-meteo.com)와 api-key(config/application-local.yml)를 넣거나 끈다
    climate:
      enabled: ${WEARLY_WEATHER_CLIMATE_ENABLED:true}
      base-url: ${WEARLY_WEATHER_CLIMATE_BASE_URL:https://archive-api.open-meteo.com}
      api-key: ${WEARLY_WEATHER_CLIMATE_API_KEY:}
      # 지난 완결 연도 몇 해로 계산할지 (2026년이면 2016~2025)
      years: ${WEARLY_WEATHER_CLIMATE_YEARS:10}
    # 장소 검색: Open-Meteo 지오코딩 API (키 없음, language=ko로 한글 검색어·한글 이름). 무료 API는 비상업용이다(평년값과 같은 조건).
    # 끄거나 실패하면 날씨 공급자(WeatherAPI) 검색으로 대신한다 (그때 이름은 영어). 상업 서비스는 유료 주소(customer-geocoding-api.open-meteo.com)·api-key
    geocoding:
      enabled: ${WEARLY_WEATHER_GEOCODING_ENABLED:true}
      base-url: ${WEARLY_WEATHER_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
      api-key: ${WEARLY_WEATHER_GEOCODING_API_KEY:}
  # 예정 코디 D-1 알림 서버 푸시 (notify 컨텍스트). 앱은 기기 로컬 알림을 따로 예약하고,
  # 토큰 등록 응답의 serverPush가 true(enabled=true · provider=expo)일 때만 로컬 D-1 알림을 끈다
  notify:
    push:
      # 서버 푸시 사용. false(기본)면 토큰은 받아 두지만 D-1 작업을 예약하지 않는다
      enabled: ${WEARLY_NOTIFY_PUSH_ENABLED:false}
      # expo: Expo Push API로 보낸다. log(기본): 보내지 않고 건수만 로그에 남긴다 (로컬 확인용)
      provider: ${WEARLY_NOTIFY_PUSH_PROVIDER:log}
      expo:
        base-url: ${WEARLY_NOTIFY_EXPO_BASE_URL:https://exp.host}
        # Expo 대시보드에서 "enhanced push security"를 켰을 때만 넣는다 (비우면 Authorization 헤더를 보내지 않는다).
        # 실제 값은 config/application-local.yml에 적는다
        access-token: ${WEARLY_NOTIFY_EXPO_ACCESS_TOKEN:}
        timeout: ${WEARLY_NOTIFY_EXPO_TIMEOUT:PT10S}
    day-before:
      # D-1 작업 시각 HH:mm (한국 시간). 내일(한국 날짜) 예정을 가진 회원에게 보낸다
      time: ${WEARLY_NOTIFY_DAY_BEFORE_TIME:19:30}
      # false면 작업을 예약하지 않는다 (테스트용)
      scheduler-enabled: ${WEARLY_NOTIFY_DAY_BEFORE_SCHEDULER_ENABLED:true}
  # 웹에서 넣은 AI 키를 암호화하는 마스터 키 (base64 32바이트, openssl rand -base64 32). 없으면 웹 키 입력이 꺼진다
  secret-key: ${WEARLY_SECRET_KEY:}
  admin:
    email: ${WEARLY_ADMIN_EMAIL:}
    password: ${WEARLY_ADMIN_PASSWORD:}
    name: ${WEARLY_ADMIN_NAME:관리자}
  # 옷 사진 저장소 (S3 호환, 18 문서). 로컬 기본은 compose의 MinIO(wearly-minio, 호스트 9000).
  # 계정 wearly / wearly-minio-local은 로컬 전용 값이다 (DB 비밀번호와 같은 취급). 운영 예시: backend/config/application-cloud.example.yml
  storage:
    endpoint: ${WEARLY_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${WEARLY_STORAGE_REGION:us-east-1}
    bucket: ${WEARLY_STORAGE_BUCKET:wearly-images}
    access-key: ${WEARLY_STORAGE_ACCESS_KEY:wearly}
    secret-key: ${WEARLY_STORAGE_SECRET_KEY:wearly-minio-local}
    path-style: ${WEARLY_STORAGE_PATH_STYLE:true}
    # 서명 URL 주소. 비우면 요청 Host 이름 + endpoint 포트(시뮬레이터 localhost:9000, 실제 휴대폰 <Mac LAN IP>:9000)
    public-endpoint: ${WEARLY_STORAGE_PUBLIC_ENDPOINT:}
    auto-create-bucket: ${WEARLY_STORAGE_AUTO_CREATE_BUCKET:false}
    upload-url-ttl: ${WEARLY_STORAGE_UPLOAD_URL_TTL:PT10M}
    download-url-ttl: ${WEARLY_STORAGE_DOWNLOAD_URL_TTL:PT1H}
    max-upload-bytes: ${WEARLY_STORAGE_MAX_UPLOAD_BYTES:10MB}
    daily-upload-limit: ${WEARLY_STORAGE_DAILY_UPLOAD_LIMIT:200}
    max-pixels: ${WEARLY_STORAGE_MAX_PIXELS:40000000}
    processing-concurrency: ${WEARLY_STORAGE_PROCESSING_CONCURRENCY:2}
    stale-after: ${WEARLY_STORAGE_STALE_AFTER:P1D}
    cleanup-enabled: ${WEARLY_STORAGE_CLEANUP_ENABLED:true}
    cleanup-interval: ${WEARLY_STORAGE_CLEANUP_INTERVAL:PT1H}
    # 저장하는 사진 크기 (긴 변 픽셀)와 JPEG 품질. 바꿔도 이미 저장된 사진은 그대로 둔다
    original-max-side: ${WEARLY_STORAGE_ORIGINAL_MAX_SIDE:1600}
    original-quality: ${WEARLY_STORAGE_ORIGINAL_QUALITY:0.8}
    thumb-max-side: ${WEARLY_STORAGE_THUMB_MAX_SIDE:400}
    thumb-quality: ${WEARLY_STORAGE_THUMB_QUALITY:0.8}
  cors:
    allowed-origins:
      - http://localhost:8081
      - http://localhost:19006
      - http://127.0.0.1:8081
      # 관리자 사이트 개발 서버 (Vite)
      - http://localhost:5173
