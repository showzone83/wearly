# 공통 설정 (git 포함, 비밀 값 없음). doc/08_백엔드_구조.md 6장.
# 로컬 비밀 값(AI 키, 관리자 계정, 마스터 키 …)은 backend/config/application-local.yml(git 제외)에 같은 속성 이름으로 적는다.
#   견본: backend/config/application-local.example.yml. 다른 파일을 쓰려면 WEARLY_LOCAL_CONFIG=<경로>
#   (테스트·하네스는 이 값을 없는 경로로 줘서 개발용 파일을 읽지 않는다)
# 아래 ${이름:기본값} 자리표시자는 OS 환경변수로도 덮어쓸 수 있다 (운영 서버·docker 등).
spring:
  application:
    name: wearly-backend
  config:
    # 들여온 파일의 값이 이 파일 값보다 우선한다. 파일이 없으면 건너뛴다(optional)
    import: optional:file:${WEARLY_LOCAL_CONFIG:./config/application-local.yml}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/wearly}
    username: ${SPRING_DATASOURCE_USERNAME:wearly}
    password: ${SPRING_DATASOURCE_PASSWORD:wearly}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      # 로그인 세션·Refresh 토큰 저장소 Valkey (16 문서). 로컬은 compose의 wearly-valkey(호스트 6380), 비밀번호 없음.
      # docker 프로필은 valkey:6379 (application-docker.yml), 운영은 같은 속성(환경변수 SPRING_DATA_REDIS_*)으로 덮어쓴다
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      # 하네스는 운영 데이터와 섞이지 않게 다른 DB 번호(1)를 쓴다
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 분석 이미지 10MB 제한. 초과하면 413 IMAGE_TOO_LARGE
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 한도를 넘긴 업로드에도 JSON 오류 응답을 끝까지 보내기 위해 본문을 받아 버린다
    max-swallow-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: app.wearly.common.mybatis
  configuration:
    map-underscore-to-camel-case: true
    # 결과를 record(생성자만 있는 클래스)로 바로 받을 때 컬럼 이름과 생성자 인자 이름으로 맞춘다 (08 문서 7장 port.out.dto)
    arg-name-based-constructor-auto-mapping: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

wearly:
  jwt:
    issuer: wearly
    # 개발용 기본값. prod 프로필에서는 WEARLY_JWT_SECRET이 반드시 있어야 한다 (application-prod.yml)
    secret: ${WEARLY_JWT_SECRET:dev-only-wearly-jwt-secret-change-me-0123456789}
    access-ttl: ${WEARLY_ACCESS_TTL:PT30M}
    refresh-ttl: ${WEARLY_REFRESH_TTL:P30D}
  ai:
    # db(기본): 관리자 화면의 AI 공급자 설정(tb_ai_provider)을 우선순위 순으로 쓴다. mock: 목업 (./gradlew bootRunMock)
    # 공급자 키는 tb_ai_provider.api_key_env의 키 이름(ANTHROPIC_API_KEY …)으로 찾는다:
    #   웹 입력 키(DB) → wearly.ai.keys.<키 이름>(application-local.yml) → 같은 이름의 OS 환경변수
    provider: ${WEARLY_AI_PROVIDER:db}
    daily-limit: ${WEARLY_AI_DAILY_LIMIT:10}
    # AI 코디 추천 일일 한도 (회원별, 사진 분석과 따로 센다. 성공만)
    outfit-daily-limit: ${WEARLY_AI_OUTFIT_DAILY_LIMIT:20}
    timeout: ${WEARLY_AI_TIMEOUT:PT60S}
    allow-base-url: ${WEARLY_AI_ALLOW_BASE_URL:false}
    # 공급자 종류별 내장 모델 목록 (관리자 화면 모델 드롭다운, doc/07 4장).
    # 키가 없거나 제공사 모델 목록을 받지 못했을 때 이 목록을 보여 주고(source: CATALOG),
    # 제공사 목록(source: LIVE)에서도 여기 있는 ID에는 recommended를 그대로 붙인다.
    # 종류 이름은 tb_ai_provider.type(CLAUDE·OPENAI·GEMINI). 없는 종류는 빈 목록이라 화면에서 직접 입력한다.
    # OPENAI·GEMINI는 확실한 최신 ID를 정하지 않아 비워 둔다 (키를 넣으면 제공사 목록이 나온다)
    model-catalog:
      CLAUDE:
        - id: claude-opus-5-5
          display-name: Claude Opus 5.5
        - id: claude-sonnet-5-5
          display-name: Claude Sonnet 5.5
          recommended: true
        - id: claude-haiku-5-5
          display-name: Claude Haiku 5.5
  # 웹에서 넣은 AI 키를 암호화하는 마스터 키 (base64 32바이트, openssl rand -base64 32). 없으면 웹 키 입력이 꺼진다
  secret-key: ${WEARLY_SECRET_KEY:}
  admin:
    email: ${WEARLY_ADMIN_EMAIL:}
    password: ${WEARLY_ADMIN_PASSWORD:}
    name: ${WEARLY_ADMIN_NAME:관리자}
  cors:
    allowed-origins:
      - http://localhost:8081
      - http://localhost:19006
      - http://127.0.0.1:8081
      # 관리자 사이트 개발 서버 (Vite)
      - http://localhost:5173
