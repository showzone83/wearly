# 운영 사진 저장소 설정 예시 (doc/18). 서버는 이 파일을 읽지 않는다 — 쓸 공급자 블록 하나를 골라
# 배포 환경의 설정(그 서버의 config/application-local.yml, 또는 같은 이름의 환경변수 WEARLY_STORAGE_*)으로 옮긴다.
# 값은 모두 자리표시자다. 비밀 키는 git·이미지에 넣지 않고 배포 환경의 비밀 관리(Secrets Manager 등)에서 넣는다.
#
# 공통 규칙
# - 버킷은 비공개로 만든다 (익명 읽기·목록 금지). 앱은 백엔드가 준 서명 URL로만 올리고 받는다.
# - public-endpoint: 서명 URL에 쓰는 주소. 비우면 "요청 Host 이름 + endpoint 포트"로 만드는데(로컬 MinIO용),
#   클라우드에서는 앱이 API 서버와 다른 호스트(저장소)로 가야 하므로 endpoint가 있는 공급자는 반드시 endpoint와 같은 값을 넣는다.
#   endpoint를 비운 AWS S3는 public-endpoint도 비우면 AWS 기본 주소(https://<bucket>.s3.<region>.amazonaws.com)로 서명한다.
# - Expo 웹(브라우저)에서 바로 PUT·GET하려면 버킷 CORS에 웹 출처·PUT·GET·Content-Type 헤더를 허용해야 한다 (네이티브 앱은 상관없음).
# - 버킷 수명 주기 규칙으로 uploads/ 접두사를 1일 뒤 지우게 해 두면 정리 작업이 놓친 업로드 원본도 지워진다(선택).

# ── AWS S3 ──
# 자격 증명을 비우면 AWS 기본 체인(EC2·ECS IAM 역할, AWS_ACCESS_KEY_ID 환경변수 등)을 쓴다.
# IAM 권한: s3:PutObject, s3:GetObject, s3:DeleteObject, s3:ListBucket (그 버킷만)
wearly:
  storage:
    endpoint: ""
    region: ap-northeast-2
    bucket: <버킷 이름>
    access-key: ""
    secret-key: ""
    path-style: false
    public-endpoint: ""
    auto-create-bucket: false

# ── Cloudflare R2 ──
# 계정 ID는 R2 대시보드, 키는 R2 → Manage R2 API Tokens (Object Read & Write, 그 버킷만). region은 auto
# wearly:
#   storage:
#     endpoint: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
#     region: auto
#     bucket: <버킷 이름>
#     access-key: <R2 Access Key ID>
#     secret-key: <R2 Secret Access Key>
#     path-style: true
#     public-endpoint: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
#     auto-create-bucket: false

# ── 네이버 클라우드 Object Storage ──
# 키는 마이페이지 → 인증키 관리 (API 인증키). 리전 kr-standard
# wearly:
#   storage:
#     endpoint: https://kr.object.ncloudstorage.com
#     region: kr-standard
#     bucket: <버킷 이름>
#     access-key: <Access Key ID>
#     secret-key: <Secret Key>
#     path-style: true
#     public-endpoint: https://kr.object.ncloudstorage.com
#     auto-create-bucket: false

# 그 밖의 값(기본값은 application.yml): upload-url-ttl PT10M, download-url-ttl PT1H, max-upload-bytes 10MB,
# daily-upload-limit 200, max-pixels 40000000, processing-concurrency 2, stale-after P1D,
# cleanup-enabled true, cleanup-interval PT1H
