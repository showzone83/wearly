# 로컬 비밀 설정 견본 (doc/08_백엔드_구조.md 6장). 이 파일은 git에 올리고, 실제 값은 복사본에 넣는다.
#
#   cp config/application-local.example.yml config/application-local.yml   # backend/ 에서, 처음 한 번
#   chmod 600 config/application-local.yml
#
# application-local.yml은 git에 올리지 않는다 (.gitignore, .dockerignore). 서버는 backend/ 에서 실행할 때
# ./config/application-local.yml을 읽는다 (application.yml의 spring.config.import, 다른 경로는 WEARLY_LOCAL_CONFIG).
# docker compose의 backend 컨테이너는 이 폴더(backend/config)를 /app/config로 읽기 전용 마운트해서 같은 파일을 읽는다.
#
# 값은 따옴표로 감싼다 (특수문자가 있어도 yml 문법이 깨지지 않게). 비워 둔 항목은 application.yml의 기본값을 쓴다.
# 필요 없는 항목은 지우거나 주석으로 둬도 된다. DB 주소 등 공통 설정은 여기 적지 않는다.

wearly:
  ai:
    # AI 공급자 키. 이름은 관리자 사이트 'AI 공급자'의 '서버 설정 키'(tb_ai_provider.api_key_env)와 같아야 한다.
    # 찾는 순서: 관리자 사이트에서 웹으로 넣은 키(DB) → 여기 wearly.ai.keys.<이름> → 같은 이름의 OS 환경변수.
    # 처음 상태: claude(사용, 키 ANTHROPIC_API_KEY) · openai·gemini(꺼짐). 키 없이 보려면 ./gradlew bootRunMock
    keys:
      ANTHROPIC_API_KEY: ""
      # OPENAI_API_KEY: ""
      # GEMINI_API_KEY: ""

  weather:
    # 날씨 공급자 키 (doc/17_날씨.md). 이름은 관리자 사이트 '날씨 > 공급자'의 '서버 설정 키'(tb_weather_provider.key_name)와 같아야 한다.
    # https://www.weatherapi.com/ 에 가입하면 대시보드에서 키를 받는다. 비워 두면 그 공급자는 건너뛴다(키 없음).
    # 키 없이 화면만 보려면 WEARLY_WEATHER_PROVIDER=mock 으로 띄운다
    keys:
      WEATHERAPI_KEY: ""
    # 평년값(예보 밖 날짜, doc/19): Open-Meteo 무료 API(키 없음, 비상업용)를 쓴다. 상업 서비스에서는 유료 플랜 주소·키를 넣거나 끈다
    # climate:
    #   enabled: true
    #   base-url: https://customer-archive-api.open-meteo.com
    #   api-key: ""
    # 장소 검색(doc/19): Open-Meteo 지오코딩 무료 API(키 없음, 비상업용). 상업 서비스에서는 유료 플랜 주소·키를 넣거나 끈다 (끄면 WeatherAPI 검색, 이름은 영어)
    # geocoding:
    #   enabled: true
    #   base-url: https://customer-geocoding-api.open-meteo.com
    #   api-key: ""

  # 관리자 사이트에서 웹으로 넣은 AI 키를 AES-256-GCM으로 암호화하는 마스터 키 (base64로 인코딩한 32바이트).
  # 만들기: openssl rand -base64 32. 비워 두면 웹 키 입력이 꺼진다 (저장 API 409 SECRET_KEY_MISSING, 서버 설정 키는 그대로 씀).
  # 이 값을 바꾸거나 잃어버리면 이미 넣은 웹 키는 복호화되지 않는다 → 관리자 화면에서 다시 넣어야 한다.
  secret-key: ""

  # 관리자 계정. email·password가 둘 다 있고 관리자(ADMIN)가 한 명도 없을 때만 서버 시작 시 이 계정을 만든다.
  # 그 이메일로 이미 가입한 일반 회원이 있으면 관리자로 올리지 않는다(경고 로그만). 관리자가 있으면 이 값은 쓰지 않는다.
  # 비밀번호는 첫 생성에만 쓰고, 이후에는 관리자 사이트 '내 계정'에서 바꾼다(여기 값은 지워도 된다). 가입 API로는 관리자를 만들 수 없다.
  admin:
    email: ""
    password: ""
    name: "관리자"
    # 관리자 2단계 인증(TOTP). 기본 true: 관리자 사이트에 로그인하면 인증 앱(Google Authenticator 등) 등록·코드 확인을 거친다.
    # 켜려면 위 secret-key(마스터 키)가 꼭 있어야 한다(TOTP 비밀을 암호화). 로컬 개발에서 번거로우면 false로 끈다
    # (false여도 TOTP를 등록한 관리자는 코드를 확인한다).
    # mfa:
    #   required: false

  # 관리자 사이트 회사 계정 로그인 SSO (doc/22 4.2, 범용 OIDC). 기본은 꺼짐. 켜도 위 admin 계정(비밀번호 + TOTP)은 비상 계정으로 남는다.
  # 관리자 사이트 로그인 화면에 공급자마다 "<display-name> 로그인" 버튼이 생긴다. IdP에 등록할 redirect URI(백엔드 콜백):
  #   http(s)://<백엔드 주소>/api/v1/auth/sso/<공급자 ID>/callback   (로컬: http://localhost:8080/api/v1/auth/sso/keycloak/callback)
  # redirect-allowlist에는 관리자 사이트의 /sso/callback(로그인 뒤)과 /login(IdP 로그아웃 뒤) 주소를 정확히 적는다.
  # sso:
  #   enabled: true
  #   trust-idp-mfa: true            # true(기본): IdP가 MFA를 맡는다고 보고 앱 TOTP를 묻지 않는다
  #   providers:
  #     # ① 로컬 Keycloak (docker compose --profile sso up -d keycloak). 아래 값은 infra/keycloak/wearly-realm.json의 로컬 전용 시험 값이다.
  #     #    시험 계정: admin@wearly.local / WearlyAdmin1! (wearly-admins), viewer@wearly.local / WearlyViewer1! (wearly-viewers → 거부)
  #     keycloak:
  #       display-name: "회사 계정 (Keycloak)"
  #       issuer-uri: http://localhost:8180/realms/wearly
  #       client-id: wearly-admin
  #       client-secret: "wearly-admin-local-secret"
  #       admin-groups: [wearly-admins]
  #       redirect-allowlist:
  #         - http://localhost:5173/sso/callback
  #         - http://localhost:5173/login
  #
  #     # ② Microsoft Entra ID (단일 테넌트). 앱 등록 → 인증: 웹 redirect URI = 백엔드 콜백, 인증서 및 비밀 → 클라이언트 비밀.
  #     #    권한은 앱 역할(App roles, 예: Wearly.Admin)을 만들어 사용자·그룹에 할당하고 roles 클레임으로 받는 것을 권한다
  #     #    (groups 클레임은 이름이 아니라 그룹 개체 ID(GUID)가 온다 — groups를 쓰려면 admin-groups에 GUID를 적는다).
  #     #    Entra는 email_verified를 주지 않으므로 같은 이메일의 기존 관리자와 처음 연결하려면 assume-email-verified: true
  #     #    (회사 테넌트에서 관리하는 이메일일 때만). 로그인 이메일을 받으려면 토큰 구성에서 email 선택적 클레임을 더한다.
  #     entra:
  #       display-name: "Microsoft 회사 계정"
  #       issuer-uri: https://login.microsoftonline.com/<테넌트 ID>/v2.0
  #       client-id: "<애플리케이션(클라이언트) ID>"
  #       client-secret: ""
  #       roles-claim: roles
  #       admin-groups: [Wearly.Admin]
  #       assume-email-verified: true
  #       redirect-allowlist: [https://admin.wearly.app/sso/callback, https://admin.wearly.app/login]
  #
  #     # ③ Google Workspace. Google Cloud 콘솔 → OAuth 클라이언트(웹 애플리케이션), 승인된 리디렉션 URI = 백엔드 콜백.
  #     #    Google ID 토큰에는 그룹 클레임이 없다 → admin-emails(검증된 이메일 목록)로 관리자를 정한다.
  #     #    Google은 end_session_endpoint가 없어 로그아웃은 이 사이트에서만 된다.
  #     google:
  #       display-name: "Google 회사 계정"
  #       issuer-uri: https://accounts.google.com
  #       client-id: "<클라이언트 ID>.apps.googleusercontent.com"
  #       client-secret: ""
  #       admin-emails: [admin@yourcompany.com]
  #       redirect-allowlist: [https://admin.wearly.app/sso/callback, https://admin.wearly.app/login]
  #
  #   그 밖의 키: discovery-uri(기본 issuer-uri + /.well-known/openid-configuration), scopes(기본 openid profile email),
  #   callback-uri(프록시 뒤라 요청 주소가 실제 주소와 다를 때 IdP에 등록한 콜백 주소를 그대로), enabled(공급자 하나만 끄기)
  #   비밀은 환경변수로도 줄 수 있다: WEARLY_SSO_ENABLED=true, WEARLY_SSO_PROVIDERS_KEYCLOAK_CLIENTSECRET=... (Spring 규칙: 점은 _, 하이픈은 뺀다)

  # JWT 서명 키 (HS256, 32바이트 이상). 비워 두면 개발용 고정값. 운영(prod 프로필)에서는 필수
  # jwt:
  #   secret: ""

  # 옷 사진 저장소 (doc/18). 로컬 MinIO(docker compose의 minio, 계정 wearly / wearly-minio-local) 값이 application.yml
  # 기본값이라 로컬에서는 적지 않는다. 실제 휴대폰에서 Mac LAN IP가 아닌 다른 주소로 사진을 받아야 할 때만 public-endpoint를 넣는다.
  # 클라우드(AWS S3·Cloudflare R2·NCP) 예시는 config/application-cloud.example.yml
  # storage:
  #   public-endpoint: "http://192.168.0.10:9000"

  # 예정 코디 D-1 서버 푸시 (notify). 기본은 꺼짐(enabled: false)이고 provider: log(보내지 않고 로그만).
  # 실제 휴대폰으로 보내려면 enabled: true, provider: expo. Expo "enhanced push security"를 켰다면 access-token을 넣는다
  # notify:
  #   push:
  #     enabled: true
  #     provider: expo
  #     expo:
  #       access-token: ""
  #   day-before:
  #     time: "19:30"
